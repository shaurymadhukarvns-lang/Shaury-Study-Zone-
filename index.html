<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A2138">
<meta name="description" content="Shaury Study Zone — UP बोर्ड कक्षा 9 से 12 तक के विद्यार्थियों के लिए ऑनलाइन लर्निंग ऐप। वीडियो लेक्चर, हिंदी नोट्स, DPP, मॉक टेस्ट।">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shaury Study Zone">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231266F1'/%3E%3Cpath d='M4 9.6 12 6l8 3.6-8 3.6z' fill='white'/%3E%3Cpath d='M7.4 11.6V15c0 1 2 1.9 4.6 1.9s4.6-.9 4.6-1.9v-3.4' stroke='white' stroke-width='1.2' fill='none'/%3E%3C/svg%3E">
<title>Shaury Study Zone — Learn Today, Lead Tomorrow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ 1. TOKENS ============ */
:root{
  --navy-950:#04101D;
  --navy-900:#061426;
  --navy-800:#0A2138;
  --navy-700:#0E2C4A;
  --navy-600:#143A5F;
  --blue-700:#0B4FD1;
  --blue-600:#1266F1;
  --blue-500:#3B86FA;
  --blue-200:#BBD6FE;
  --blue-100:#DCE9FF;
  --blue-50:#EEF5FF;
  --amber-600:#D98600;
  --amber-500:#F5A524;
  --amber-100:#FFF1D6;
  --green-600:#0E9E5B;
  --green-100:#DFF7EA;
  --red-600:#D93A3F;
  --red-100:#FDE6E7;
  --bg:#F4F7FC;
  --bg-2:#EBF1FA;
  --surface:#FFFFFF;
  --surface-2:#F8FAFE;
  --text:#0B1B2B;
  --text-2:#3D5166;
  --dim:#6C7F94;
  --border:rgba(11,27,43,.09);
  --border-2:rgba(11,27,43,.14);
  --shadow-s:0 1px 2px rgba(10,33,56,.06),0 1px 3px rgba(10,33,56,.05);
  --shadow-m:0 4px 12px rgba(10,33,56,.07),0 2px 4px rgba(10,33,56,.04);
  --shadow-l:0 14px 40px rgba(10,33,56,.14),0 4px 10px rgba(10,33,56,.06);
  --r-s:10px; --r-m:14px; --r-l:20px; --r-xl:26px;
  --font-d:"Baloo 2","Noto Sans Devanagari",system-ui,sans-serif;
  --font-b:"Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --nav-h:66px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#071522; --bg-2:#0A1B2C; --surface:#0D2337; --surface-2:#102A41;
    --text:#EAF2FB; --text-2:#B9CCDE; --dim:#8AA1B8;
    --border:rgba(255,255,255,.10); --border-2:rgba(255,255,255,.18);
    --blue-50:#0F2A46; --blue-100:#123A5E; --blue-200:#1B4C7A;
    --amber-100:#3A2A0C; --green-100:#0B2E1F; --red-100:#3A1417;
    --shadow-s:0 1px 2px rgba(0,0,0,.4); --shadow-m:0 4px 14px rgba(0,0,0,.35);
    --shadow-l:0 18px 44px rgba(0,0,0,.5);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-b); background:var(--bg); color:var(--text);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  overflow-x:hidden; min-height:100dvh;
}
h1,h2,h3,h4,h5{font-family:var(--font-d); margin:0; line-height:1.25; letter-spacing:-.01em; font-weight:700}
p{margin:0}
a{color:var(--blue-600); text-decoration:none}
button{font-family:inherit; font-size:inherit; cursor:pointer; border:0; background:none; color:inherit}
input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
img,svg{max-width:100%}
::selection{background:var(--blue-200); color:var(--navy-900)}
:focus-visible{outline:2.5px solid var(--blue-500); outline-offset:2px; border-radius:6px}
svg[aria-hidden="true"]{width:1em;height:1em;flex:0 0 auto;display:inline-block;vertical-align:-.125em}
.qi{width:36px;height:36px;border-radius:11px;background:var(--blue-50);color:var(--blue-600);display:grid;place-items:center;flex:0 0 auto}
.qi svg{width:19px;height:19px}
.badge svg{width:12px;height:12px}
a.bcard,a.lec,a.ncard,a.class-card{color:var(--text)}
.ncard .grow > b,.ncard .grow > small{display:block}
.ncard .grow > small{margin-top:2px}
.lec .grow > b,.lec .grow > small{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ 2. SPLASH ============ */
#splash{
  position:fixed; inset:0; z-index:9999; display:grid; place-items:center;
  background:radial-gradient(120% 90% at 50% 0%,#123A5F 0%,#0A2138 45%,#04101D 100%);
  transition:opacity .55s ease, visibility .55s;
}
#splash.gone{opacity:0; visibility:hidden; pointer-events:none}
.splash-inner{display:flex; flex-direction:column; align-items:center; gap:18px; padding:24px}
.splash-logo{
  width:112px;height:112px;border-radius:30px; display:grid; place-items:center;
  background:linear-gradient(150deg,#3B86FA,#0B4FD1);
  box-shadow:0 22px 60px rgba(18,102,241,.45), inset 0 1px 0 rgba(255,255,255,.4);
  animation:pop .7s cubic-bezier(.2,.9,.3,1.3) both;
}
.splash-logo svg{width:64px;height:64px}
.splash-title{
  font-family:var(--font-d); font-weight:800; font-size:27px; color:#fff; letter-spacing:-.02em;
  animation:fadeUp .6s .18s both; text-align:center;
}
.splash-tag{color:#9CC0EA; font-size:13.5px; letter-spacing:.13em; text-transform:uppercase; animation:fadeUp .6s .3s both}
.splash-bar{width:132px;height:3px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:10px;animation:fadeUp .6s .42s both}
.splash-bar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,#3B86FA,#9CC0EA);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}
@keyframes pop{0%{transform:scale(.6) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ============ 3. SHELL ============ */
#app{display:none}
#app.on{display:block}
.shell{display:grid; grid-template-columns:minmax(0,1fr); min-height:100dvh}
.shell > div{min-width:0}
@media(min-width:1000px){
  .shell{grid-template-columns:264px minmax(0,1fr)}
}
/* sidebar (desktop) */
.side{
  display:none; position:sticky; top:0; height:100dvh; overflow-y:auto;
  background:linear-gradient(180deg,#0A2138,#061426 70%);
  padding:22px 16px 18px; color:#C7D9EC;
}
@media(min-width:1000px){ .side{display:flex; flex-direction:column; gap:6px} }
.side-brand{display:flex; align-items:center; gap:11px; padding:0 6px 18px; margin-bottom:8px; border-bottom:1px solid rgba(255,255,255,.08)}
.side-brand .mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(150deg,#3B86FA,#0B4FD1);display:grid;place-items:center;flex:0 0 auto}
.side-brand .mark svg{width:24px;height:24px}
.side-brand b{font-family:var(--font-d);font-size:15.5px;color:#fff;display:block;line-height:1.15}
.side-brand span{font-size:10.5px;color:#7FA0C0;letter-spacing:.09em;text-transform:uppercase}
.side-lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#5F82A3;margin:16px 8px 6px;font-weight:600}
.nav-i{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px;
  color:#B4CBE0; font-size:14px; font-weight:500; transition:.16s; width:100%; text-align:left;
}
.nav-i svg{width:19px;height:19px;flex:0 0 auto;opacity:.85}
.nav-i:hover{background:rgba(255,255,255,.07); color:#fff}
.nav-i.on{background:linear-gradient(100deg,rgba(18,102,241,.95),rgba(59,134,250,.75)); color:#fff; box-shadow:0 6px 18px rgba(18,102,241,.35)}
.nav-i .pill{margin-left:auto;font-size:10.5px;background:var(--amber-500);color:#3B2600;font-weight:700;padding:1px 7px;border-radius:20px}
.side-foot{margin-top:auto; padding-top:16px; border-top:1px solid rgba(255,255,255,.08); font-size:11.5px; color:#5F82A3}

/* mobile header */
.mhead{
  position:sticky; top:0; z-index:60; display:flex; align-items:center; gap:12px;
  padding:12px 16px; background:linear-gradient(120deg,#0A2138,#0E2C4A);
  color:#fff; box-shadow:0 2px 14px rgba(6,20,38,.25);
}
@media(min-width:1000px){ .mhead{display:none} }
.mhead .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(150deg,#3B86FA,#0B4FD1);display:grid;place-items:center}
.mhead .mark svg{width:20px;height:20px}
.mhead b{font-family:var(--font-d);font-size:15px;display:block;line-height:1.1}
.mhead small{font-size:10px;color:#8FB2D6;letter-spacing:.1em;text-transform:uppercase}
.mhead .spacer{flex:1}
.icon-btn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:rgba(255,255,255,.11); color:#fff; transition:.15s; flex:0 0 auto;
}
.icon-btn:hover{background:rgba(255,255,255,.2)}
.icon-btn svg{width:19px;height:19px}
.avatar{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(150deg,#3B86FA,#0B4FD1); color:#fff; font-weight:700; font-size:14px;
  font-family:var(--font-d); border:2px solid rgba(255,255,255,.3);
}

/* main */
main{padding:0 0 calc(var(--nav-h) + 20px + var(--safe-b)); min-width:0}
@media(min-width:1000px){ main{padding:0 0 40px} }
.wrap{max-width:1080px; margin:0 auto; padding:16px}
@media(min-width:1000px){ .wrap{padding:26px 32px} }

/* bottom nav */
.bnav{
  position:fixed; left:0; right:0; bottom:0; z-index:70;
  display:grid; grid-template-columns:repeat(5,1fr);
  background:var(--surface); border-top:1px solid var(--border);
  padding:6px 4px calc(6px + var(--safe-b));
  box-shadow:0 -6px 22px rgba(10,33,56,.08);
}
@media(min-width:1000px){ .bnav{display:none} }
.bnav button,.bnav a{
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px;
  color:var(--dim); font-size:10.5px; font-weight:600; border-radius:11px; transition:.15s;
  text-decoration:none;
}
.bnav button svg,.bnav a svg{width:22px;height:22px}
.bnav button.on,.bnav a.on{color:var(--blue-600)}
.bnav button.on svg,.bnav a.on svg{transform:translateY(-1px)}
.bnav button.on::after,.bnav a.on::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--blue-600)}
.cls-grid{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:620px){ .cls-grid{grid-template-columns:repeat(4,minmax(0,1fr))} }

/* ============ 4. ATOMS ============ */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-l); box-shadow:var(--shadow-s)}
.pad{padding:16px}
@media(min-width:700px){ .pad{padding:20px} }
.row{display:flex; align-items:center; gap:10px}
.row.wrap-r{flex-wrap:wrap}
.between{justify-content:space-between}
.col{display:flex; flex-direction:column}
.grow{flex:1; min-width:0}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mt18{margin-top:18px}.mt24{margin-top:24px}
.mb6{margin-bottom:6px}.mb10{margin-bottom:10px}.mb14{margin-bottom:14px}.mb18{margin-bottom:18px}
.hide{display:none!important}
.txt-dim{color:var(--dim)}
.txt-s{font-size:12.5px}
.txt-xs{font-size:11.5px}
.strong{font-weight:700}
.center{text-align:center}
.trunc{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.sec-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:26px 0 12px}
.sec-head h2{font-size:19px}
@media(min-width:700px){ .sec-head h2{font-size:22px} }
.sec-head .more{font-size:12.5px; font-weight:600; color:var(--blue-600); white-space:nowrap}
.eyebrow{display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--blue-600)}
.eyebrow::before{content:""; width:14px; height:2.5px; border-radius:2px; background:currentColor}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 20px; border-radius:13px; font-weight:600; font-size:14.5px;
  transition:transform .12s, box-shadow .18s, background .18s, opacity .18s;
  font-family:var(--font-d); letter-spacing:.01em; white-space:nowrap;
}
.btn:active{transform:scale(.975)}
.btn svg{width:18px;height:18px}
.btn-p{background:linear-gradient(120deg,#2C7BF7,#0B4FD1); color:#fff; box-shadow:0 8px 20px rgba(18,102,241,.32)}
.btn-p:hover{box-shadow:0 10px 26px rgba(18,102,241,.42)}
.btn-a{background:linear-gradient(120deg,#F7B33C,#E08A00); color:#3B2600; box-shadow:0 8px 20px rgba(224,138,0,.3)}
.btn-g{background:var(--surface); color:var(--text); border:1.5px solid var(--border-2)}
.btn-g:hover{background:var(--surface-2)}
.btn-navy{background:var(--navy-800); color:#fff}
.btn-d{background:var(--red-100); color:var(--red-600); border:1.5px solid transparent}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:10px}
.btn-sm svg{width:15px;height:15px}
.btn-lg{padding:15px 26px; font-size:16px; border-radius:15px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55; pointer-events:none}

.chip{
  display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:30px;
  background:var(--surface); border:1.5px solid var(--border-2); font-size:13px; font-weight:600;
  color:var(--text-2); transition:.16s; white-space:nowrap;
}
.chip:hover{border-color:var(--blue-500); color:var(--blue-600)}
.chip.on{background:var(--navy-800); border-color:var(--navy-800); color:#fff}
.chip-row{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; letter-spacing:.02em}
.b-free{background:var(--green-100); color:var(--green-600)}
.b-paid{background:var(--amber-100); color:var(--amber-600)}
.b-blue{background:var(--blue-50); color:var(--blue-600)}
.b-red{background:var(--red-100); color:var(--red-600)}
.b-grey{background:var(--bg-2); color:var(--dim)}

.bar{height:7px; border-radius:20px; background:var(--bg-2); overflow:hidden}
.bar i{display:block; height:100%; border-radius:20px; background:linear-gradient(90deg,#3B86FA,#0B4FD1); transition:width .5s ease}
.bar.g i{background:linear-gradient(90deg,#25C67E,#0E9E5B)}
.bar.a i{background:linear-gradient(90deg,#F7B33C,#E08A00)}

/* inputs */
.field{display:block; margin-bottom:14px}
.field > span{display:block; font-size:12.5px; font-weight:600; color:var(--text-2); margin-bottom:6px}
.inp{
  width:100%; padding:12px 14px; border-radius:12px; background:var(--surface-2);
  border:1.5px solid var(--border-2); color:var(--text); transition:.16s; font-size:14.5px;
}
.inp::placeholder{color:var(--dim); opacity:.85}
.inp:focus{outline:none; border-color:var(--blue-500); background:var(--surface); box-shadow:0 0 0 4px rgba(18,102,241,.11)}
textarea.inp{resize:vertical; min-height:84px; line-height:1.5}
select.inp{appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236C7F94' stroke-width='2.4'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; background-size:16px; padding-right:38px}
.inp-err{border-color:var(--red-600)!important; box-shadow:0 0 0 4px rgba(217,58,63,.1)!important}
.err-txt{color:var(--red-600); font-size:12px; margin-top:5px; display:none}
.err-txt.on{display:block}
.pw-wrap{position:relative}
.pw-wrap .inp{padding-right:46px}
.pw-eye{position:absolute; right:6px; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:9px; display:grid; place-items:center; color:var(--dim)}
.pw-eye svg{width:18px;height:18px}

/* grid */
.grid{display:grid; gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:1fr}
@media(min-width:640px){ .g3{grid-template-columns:repeat(3,minmax(0,1fr))} }
.g-auto{grid-template-columns:repeat(auto-fill,minmax(238px,1fr))}
@media(max-width:400px){ .g2{grid-template-columns:1fr} }

/* ============ 5. HERO / DASHBOARD ============ */
.hero{
  position:relative; overflow:hidden; border-radius:var(--r-xl); padding:22px 20px 20px;
  background:linear-gradient(135deg,#0E2C4A 0%,#0A2138 55%,#123A5F 100%);
  color:#fff; box-shadow:var(--shadow-l);
}
.hero::before{
  content:""; position:absolute; width:280px; height:280px; border-radius:50%;
  right:-110px; top:-140px; background:radial-gradient(circle,rgba(59,134,250,.55),transparent 68%);
}
.hero::after{
  content:""; position:absolute; inset:0;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:26px 26px; mask-image:radial-gradient(120% 100% at 100% 0%,#000,transparent 72%);
}
.hero > *{position:relative; z-index:1}
.hero h1{font-size:22px; margin-bottom:6px}
@media(min-width:700px){ .hero h1{font-size:29px} }
.hero p{color:#A9C6E4; font-size:13.5px; max-width:44ch}
.hero-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:18px}
.hstat{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.13); border-radius:14px; padding:10px 8px; text-align:center; backdrop-filter:blur(6px)}
.hstat b{display:block; font-family:var(--font-d); font-size:19px; color:#fff; line-height:1.15}
.hstat span{font-size:10.5px; color:#9CC0EA; letter-spacing:.04em}

/* class cards */
.class-card{
  position:relative; overflow:hidden; border-radius:var(--r-m); padding:14px;
  border:1.5px solid var(--border); background:var(--surface); text-align:left;
  transition:.18s; display:flex; align-items:center; gap:12px; width:100%;
}
.class-card:hover{border-color:var(--blue-500); box-shadow:var(--shadow-m); transform:translateY(-2px)}
.class-card .num{
  width:46px; height:46px; border-radius:13px; display:grid; place-items:center; flex:0 0 auto;
  font-family:var(--font-d); font-weight:800; font-size:17px; color:#fff;
  background:linear-gradient(150deg,#3B86FA,#0B4FD1);
}
.class-card[data-c="10"] .num{background:linear-gradient(150deg,#25C67E,#0E9E5B)}
.class-card[data-c="11"] .num{background:linear-gradient(150deg,#F7B33C,#E08A00); color:#3B2600}
.class-card[data-c="12"] .num{background:linear-gradient(150deg,#5B8DEF,#2C4F86)}
.class-card b{display:block; font-family:var(--font-d); font-size:14.5px}
.class-card small{color:var(--dim); font-size:11.5px}
.class-card .sel{margin-left:auto; color:var(--blue-600)}

/* batch / course card */
.bcard{
  border-radius:var(--r-l); overflow:hidden; background:var(--surface);
  border:1px solid var(--border); box-shadow:var(--shadow-s); transition:.2s;
  display:flex; flex-direction:column; text-align:left; width:100%;
}
.bcard:hover{box-shadow:var(--shadow-l); transform:translateY(-3px); border-color:var(--blue-200)}
.bcard .thumb{
  position:relative; aspect-ratio:16/9; display:grid; place-items:center; color:#fff;
  background:linear-gradient(135deg,#0E2C4A,#123A5F); overflow:hidden;
}
.bcard .thumb .t1{position:absolute; inset:0; background:radial-gradient(circle at 78% 18%,rgba(59,134,250,.55),transparent 62%)}
.bcard .thumb .ico{position:relative; width:44px; height:44px; opacity:.92}
.bcard .thumb .tag{position:absolute; top:9px; left:9px; z-index:2}
.bcard .thumb .tag.r{left:auto; right:9px}
.bcard .body{padding:12px 14px 14px; display:flex; flex-direction:column; gap:7px; flex:1}
.bcard h3{font-size:14.5px; line-height:1.35}
.bcard .meta{display:flex; align-items:center; gap:10px; font-size:11.5px; color:var(--dim); flex-wrap:wrap}
.bcard .meta span{display:inline-flex; align-items:center; gap:4px}
.bcard .meta svg{width:13px;height:13px;opacity:.8}
.bcard .foot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:auto; padding-top:4px}
.price{font-family:var(--font-d); font-weight:800; font-size:17px; color:var(--text)}
.price s{font-family:var(--font-b); font-size:11.5px; color:var(--dim); font-weight:400; margin-left:5px}
.price.free{color:var(--green-600)}

/* lecture row */
.lec{
  display:flex; gap:12px; align-items:center; padding:11px; border-radius:14px;
  border:1px solid var(--border); background:var(--surface); transition:.16s; width:100%; text-align:left;
}
.lec:hover{background:var(--surface-2); border-color:var(--blue-200)}
.lec .lt{
  width:78px; aspect-ratio:16/10; border-radius:10px; flex:0 0 auto; position:relative;
  background:linear-gradient(140deg,#123A5F,#0A2138); display:grid; place-items:center; color:#fff;
}
.lec .lt svg{width:19px;height:19px;opacity:.9}
.lec .lt .len{position:absolute; bottom:3px; right:4px; font-size:9.5px; background:rgba(0,0,0,.6); padding:0 4px; border-radius:4px; font-weight:600}
.lec b{display:block; font-size:13.5px; font-family:var(--font-b); font-weight:600; line-height:1.35}
.lec small{color:var(--dim); font-size:11.5px; display:block; margin-top:2px}
.lec .done{color:var(--green-600); flex:0 0 auto}
.lec .done svg{width:19px;height:19px}

/* notes card */
.ncard{display:flex; gap:12px; align-items:center; padding:13px; border-radius:14px; border:1px solid var(--border); background:var(--surface); width:100%; text-align:left; transition:.16s}
.ncard:hover{border-color:var(--blue-200); background:var(--surface-2)}
.ncard .pdf{width:40px;height:46px;border-radius:8px;background:var(--red-100);color:var(--red-600);display:grid;place-items:center;flex:0 0 auto;font-size:9.5px;font-weight:800;font-family:var(--font-d);letter-spacing:.02em}
.ncard .pdf svg{width:20px;height:20px}

/* stat tiles */
.tiles{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
@media(min-width:700px){ .tiles{grid-template-columns:repeat(4,1fr)} }
.tile{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:13px 14px; box-shadow:var(--shadow-s)}
.tile .lab{font-size:11px; color:var(--dim); display:flex; align-items:center; gap:5px; font-weight:600}
.tile .lab svg{width:13px;height:13px}
.tile b{font-family:var(--font-d); font-size:23px; display:block; line-height:1.2; margin-top:5px}
.tile b small{font-size:12px; color:var(--dim); font-weight:600}

/* announcements */
.ann{display:flex; gap:11px; padding:13px 14px; border-radius:14px; background:var(--amber-100); border:1px solid rgba(217,134,0,.2)}
.ann .dot{width:8px;height:8px;border-radius:50%;background:var(--amber-600);flex:0 0 auto;margin-top:7px}
.ann b{font-size:13.5px; font-family:var(--font-d); color:#5A3B00}
@media (prefers-color-scheme:dark){ .ann b{color:#F7C878} }
.ann p{font-size:12.5px; color:#6B4A0E; margin-top:2px}
@media (prefers-color-scheme:dark){ .ann p{color:#D9B071} }

/* ============ 6. PLAYER ============ */
.player{position:relative; width:100%; aspect-ratio:16/9; background:#04101D; border-radius:var(--r-l); overflow:hidden; display:grid; place-items:center}
.player iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.player .ph{text-align:center; padding:20px; color:#8FB2D6}
.player .ph svg{width:46px;height:46px;opacity:.5;margin-bottom:8px}
.player .ph b{display:block; color:#fff; font-family:var(--font-d); font-size:15px; margin-bottom:4px}
.player .ph p{font-size:12px; max-width:34ch; margin:0 auto}

/* ============ 7. QUIZ / TEST ============ */
.qbox{border-radius:var(--r-l); border:1px solid var(--border); background:var(--surface); padding:16px; box-shadow:var(--shadow-s)}
.qnum{font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--blue-600)}
.qtext{font-size:15.5px; font-weight:600; line-height:1.5; margin:7px 0 14px; font-family:var(--font-b)}
.opt{
  display:flex; gap:11px; align-items:flex-start; padding:13px 14px; border-radius:13px;
  border:1.5px solid var(--border-2); background:var(--surface-2); width:100%; text-align:left;
  transition:.15s; margin-bottom:9px; font-size:14px; line-height:1.5;
}
.opt:hover{border-color:var(--blue-500); background:var(--blue-50)}
.opt .k{
  width:24px;height:24px;border-radius:8px;flex:0 0 auto; display:grid; place-items:center;
  background:var(--surface); border:1.5px solid var(--border-2); font-size:12px; font-weight:700; color:var(--text-2);
}
.opt.pick{border-color:var(--blue-600); background:var(--blue-50)}
.opt.pick .k{background:var(--blue-600); border-color:var(--blue-600); color:#fff}
.opt.ok{border-color:var(--green-600); background:var(--green-100)}
.opt.ok .k{background:var(--green-600); border-color:var(--green-600); color:#fff}
.opt.bad{border-color:var(--red-600); background:var(--red-100)}
.opt.bad .k{background:var(--red-600); border-color:var(--red-600); color:#fff}
.opt[disabled]{pointer-events:none}
.expl{margin-top:10px; padding:12px 14px; border-radius:12px; background:var(--blue-50); border-left:3px solid var(--blue-600); font-size:13px; line-height:1.6}
.expl b{display:block; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--blue-600); margin-bottom:3px}
.timer{
  display:inline-flex; align-items:center; gap:7px; padding:7px 13px; border-radius:30px;
  background:var(--navy-800); color:#fff; font-weight:700; font-size:13.5px; font-variant-numeric:tabular-nums;
  font-family:var(--font-d);
}
.timer.warn{background:var(--red-600)}
.timer svg{width:15px;height:15px}
.qpal{display:flex; flex-wrap:wrap; gap:6px}
.qpal button{
  width:32px;height:32px;border-radius:9px;font-size:12px;font-weight:700;
  border:1.5px solid var(--border-2); background:var(--surface); color:var(--text-2);
}
.qpal button.ans{background:var(--green-600); border-color:var(--green-600); color:#fff}
.qpal button.cur{outline:2.5px solid var(--blue-600); outline-offset:1px}
.qpal button.skip{background:var(--bg-2); color:var(--dim)}

/* result */
.score-ring{position:relative; width:132px; height:132px; margin:0 auto}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .val{position:absolute; inset:0; display:grid; place-items:center; text-align:center}
.score-ring .val b{font-family:var(--font-d); font-size:29px; line-height:1}
.score-ring .val span{font-size:11px; color:var(--dim)}

/* ============ 8. AUTH ============ */
.auth-wrap{min-height:100dvh; display:grid; place-items:center; padding:20px 16px 32px; background:
  radial-gradient(90% 60% at 50% 0%,#123A5F 0%,#0A2138 40%,#04101D 100%)}
.auth-card{
  width:100%; max-width:410px; background:var(--surface); border-radius:var(--r-xl);
  padding:26px 22px 22px; box-shadow:0 30px 70px rgba(0,0,0,.45); animation:fadeUp .5s both;
}
.auth-logo{width:62px;height:62px;border-radius:18px;background:linear-gradient(150deg,#3B86FA,#0B4FD1);display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 12px 26px rgba(18,102,241,.4)}
.auth-logo svg{width:34px;height:34px}
.auth-card h1{font-size:21px; text-align:center}
.auth-card .sub{text-align:center; color:var(--dim); font-size:13px; margin-top:5px}
.tabs{display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--bg-2); padding:4px; border-radius:12px; margin:18px 0}
.tabs button{padding:9px; border-radius:9px; font-size:13.5px; font-weight:600; color:var(--dim); transition:.16s; font-family:var(--font-d)}
.tabs button.on{background:var(--surface); color:var(--text); box-shadow:var(--shadow-s)}
.divider{display:flex; align-items:center; gap:10px; color:var(--dim); font-size:11.5px; margin:16px 0}
.divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--border-2)}
.hint-box{background:var(--blue-50); border:1px dashed var(--blue-200); border-radius:12px; padding:11px 13px; font-size:12px; color:var(--text-2); line-height:1.6}
.hint-box code{background:var(--surface); padding:1px 6px; border-radius:5px; font-size:11.5px; font-weight:700; color:var(--blue-700); border:1px solid var(--border)}

/* ============ 9. MODAL / TOAST ============ */
.modal-root{position:fixed; inset:0; z-index:200; display:none; align-items:flex-end; justify-content:center; background:rgba(4,16,29,.55); backdrop-filter:blur(3px)}
.modal-root.on{display:flex}
@media(min-width:700px){ .modal-root{align-items:center} }
.sheet{
  width:100%; max-width:480px; background:var(--surface); border-radius:24px 24px 0 0;
  padding:20px 18px calc(20px + var(--safe-b)); max-height:92dvh; overflow-y:auto;
  animation:sheetUp .3s cubic-bezier(.2,.9,.3,1.05) both;
}
@media(min-width:700px){ .sheet{border-radius:22px; max-width:520px} }
@keyframes sheetUp{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet-grip{width:40px;height:4px;border-radius:4px;background:var(--border-2);margin:0 auto 14px}
.form-actions{position:sticky;bottom:0;background:var(--surface);padding:10px 0 4px;margin-top:10px;z-index:2;box-shadow:0 -10px 16px -12px rgba(10,33,56,.45)}
.toasts{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--nav-h) + 18px + var(--safe-b)); z-index:300; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:max-content; max-width:92vw}
@media(min-width:1000px){ .toasts{bottom:24px} }
.toast{
  display:flex; align-items:center; gap:9px; padding:11px 16px; border-radius:12px;
  background:var(--navy-800); color:#fff; font-size:13.5px; font-weight:500;
  box-shadow:0 10px 30px rgba(0,0,0,.3); animation:toastIn .28s both;
}
.toast.ok{background:#0E7A48}
.toast.err{background:#B32B30}
.toast svg{width:17px;height:17px;flex:0 0 auto}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}

/* ============ 10. ADMIN ============ */
.adm-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px}
.tbl-wrap{overflow-x:auto; border-radius:14px; border:1px solid var(--border); background:var(--surface)}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:520px}
th{text-align:left; padding:11px 13px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); background:var(--surface-2); border-bottom:1px solid var(--border); font-weight:700; white-space:nowrap}
td{padding:11px 13px; border-bottom:1px solid var(--border); vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td .mini{font-size:11.5px; color:var(--dim)}
.act{display:flex; gap:5px}
.act button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--bg-2);color:var(--text-2);transition:.15s}
.act button:hover{background:var(--blue-50); color:var(--blue-600)}
.act button.del:hover{background:var(--red-100); color:var(--red-600)}
.act svg{width:15px;height:15px}
.empty{padding:34px 20px; text-align:center; color:var(--dim)}
.empty svg{width:38px;height:38px;opacity:.35;margin-bottom:8px}
.empty b{display:block; color:var(--text-2); font-family:var(--font-d); font-size:14.5px; margin-bottom:3px}
.empty p{font-size:12.5px}

/* ============ 11. MISC ============ */
.list-rows > * + *{margin-top:9px}
.stack-sm > * + *{margin-top:10px}
.fade-in{animation:fadeUp .32s both}
.skel{background:linear-gradient(90deg,var(--bg-2) 25%,var(--surface-2) 50%,var(--bg-2) 75%); background-size:200% 100%; animation:shim 1.3s infinite; border-radius:10px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.qrbox{background:var(--surface-2);border:1.5px dashed var(--border-2);border-radius:var(--r-l);padding:16px;text-align:center}
.qrbox > img,.qrbox > svg{width:200px;height:200px;border-radius:14px;background:#fff;padding:6px;display:block;margin:0 auto 10px;box-shadow:var(--shadow-s)}
.qrbox b{display:block;font-family:var(--font-d);font-size:14px}
.upichip{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.upichip span{font-size:13px;font-weight:700;background:var(--surface);border:1px solid var(--border-2);border-radius:10px;padding:7px 12px;letter-spacing:.02em}
.lock-note{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:13px; background:var(--amber-100); border:1px solid rgba(217,134,0,.25); font-size:12.5px; color:#6B4A0E; line-height:1.55}
@media (prefers-color-scheme:dark){ .lock-note{color:#E8C489} }
.lock-note svg{width:17px;height:17px;flex:0 0 auto;margin-top:1px;color:var(--amber-600)}
.prof-hero{background:linear-gradient(135deg,#0E2C4A,#123A5F); color:#fff; border-radius:var(--r-xl); padding:20px; position:relative; overflow:hidden}
.prof-hero::after{content:""; position:absolute; width:200px;height:200px;border-radius:50%; right:-70px; top:-90px; background:radial-gradient(circle,rgba(59,134,250,.45),transparent 70%)}
.prof-hero .avatar{width:64px;height:64px;font-size:24px;border:3px solid rgba(255,255,255,.25)}
.menu-row{display:flex; align-items:center; gap:12px; padding:14px 16px; width:100%; text-align:left; border-bottom:1px solid var(--border); transition:.14s; background:none}
.menu-row:last-child{border-bottom:0}
.menu-row:hover{background:var(--surface-2)}
.menu-row .ic{width:34px;height:34px;border-radius:10px;background:var(--blue-50);color:var(--blue-600);display:grid;place-items:center;flex:0 0 auto}
.menu-row .ic svg{width:17px;height:17px}
.menu-row b{font-size:13.5px; font-weight:600; display:block}
.menu-row small{font-size:11.5px; color:var(--dim)}
.menu-row .ch{margin-left:auto; color:var(--dim)}
.menu-row .ch svg{width:17px;height:17px}

/* print — Hindi notes PDF */
#print-area{display:none}
@media print{
  body{background:#fff}
  #splash,.side,.mhead,.bnav,.modal-root,.toasts,#app,.no-print{display:none!important}
  #print-area{display:block!important; padding:0}
  #print-area .pr-head{border-bottom:2px solid #0A2138; padding-bottom:10px; margin-bottom:18px}
  #print-area h1{font-size:20px; color:#0A2138}
  #print-area h2{font-size:15px; margin:16px 0 6px; color:#0A2138}
  #print-area p, #print-area li{font-size:12.5px; line-height:1.75; color:#111}
  #print-area .pr-meta{font-size:10.5px; color:#555; margin-top:4px}
  @page{margin:16mm}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important; transition-duration:.01ms!important}
}

<script>
/* Minimal QR encoder — byte mode, ECC level L, versions 1–15. No dependencies. */
var QRLIB = (function () {
  const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (function () {
    let x = 1;
    for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11D; }
    for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  })();
  const mul = (a, b) => (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]];

  function polyMul(a, b) {
    const r = new Array(a.length + b.length - 1).fill(0);
    for (let i = 0; i < a.length; i++) for (let j = 0; j < b.length; j++) r[i + j] ^= mul(a[i], b[j]);
    return r;
  }
  function rsPoly(deg) { let p = [1]; for (let i = 0; i < deg; i++) p = polyMul(p, [1, EXP[i]]); return p; }
  function rsEncode(data, ecLen) {
    const gen = rsPoly(ecLen);
    const res = new Array(data.length + ecLen).fill(0);
    for (let i = 0; i < data.length; i++) res[i] = data[i];
    for (let i = 0; i < data.length; i++) {
      const f = res[i];
      if (f !== 0) for (let j = 0; j < gen.length; j++) res[i + j] ^= mul(gen[j], f);
    }
    return res.slice(data.length);
  }

  // [ecPerBlock, blocks1, data1, blocks2, data2]  — ECC L
  const T = {
    1: [7, 1, 19, 0, 0], 2: [10, 1, 34, 0, 0], 3: [15, 1, 55, 0, 0], 4: [20, 1, 80, 0, 0],
    5: [26, 1, 108, 0, 0], 6: [18, 2, 68, 0, 0], 7: [20, 2, 78, 0, 0], 8: [24, 2, 97, 0, 0],
    9: [30, 2, 116, 0, 0], 10: [18, 2, 68, 2, 69], 11: [20, 4, 81, 0, 0], 12: [24, 2, 92, 2, 93],
    13: [26, 4, 107, 0, 0], 14: [30, 3, 115, 1, 116], 15: [22, 5, 87, 1, 88]
  };
  const ALIGN = {
    1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30], 6: [6, 34], 7: [6, 22, 38],
    8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50], 11: [6, 30, 54], 12: [6, 32, 58],
    13: [6, 34, 62], 14: [6, 26, 46, 66], 15: [6, 26, 48, 70]
  };

  function build(text) {
    const bytes = Array.from(new TextEncoder().encode(text));
    let ver = 0;
    for (let v = 1; v <= 15; v++) {
      const cap = (T[v][1] * T[v][2] + T[v][3] * T[v][4]) * 8;
      const cc = v <= 9 ? 8 : 16;
      if (4 + cc + bytes.length * 8 <= cap) { ver = v; break; }
    }
    if (!ver) throw new Error('QR: data too long');
    const t = T[ver], ecLen = t[0];
    const totalData = t[1] * t[2] + t[3] * t[4];
    const ccBits = ver <= 9 ? 8 : 16;

    // bit stream
    const bits = [];
    const push = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    push(4, 4); push(bytes.length, ccBits);
    bytes.forEach(b => push(b, 8));
    const capBits = totalData * 8;
    push(0, Math.min(4, capBits - bits.length));
    while (bits.length % 8 !== 0) bits.push(0);
    const dataCw = [];
    for (let i = 0; i < bits.length; i += 8) {
      let v = 0; for (let j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
      dataCw.push(v);
    }
    for (let i = 0; dataCw.length < totalData; i++) dataCw.push(i % 2 === 0 ? 0xEC : 0x11);

    // split blocks
    const blocks = [];
    let p = 0;
    for (let i = 0; i < t[1]; i++) { blocks.push(dataCw.slice(p, p + t[2])); p += t[2]; }
    for (let i = 0; i < t[3]; i++) { blocks.push(dataCw.slice(p, p + t[4])); p += t[4]; }
    const ecBlocks = blocks.map(b => rsEncode(b, ecLen));

    const maxLen = Math.max.apply(null, blocks.map(b => b.length));
    const final = [];
    for (let i = 0; i < maxLen; i++) blocks.forEach(b => { if (i < b.length) final.push(b[i]); });
    for (let i = 0; i < ecLen; i++) ecBlocks.forEach(b => final.push(b[i]));

    return { ver, cw: final, size: 17 + 4 * ver };
  }

  function matrix(ver, cw) {
    const size = 17 + 4 * ver;
    const m = [], fn = [];
    for (let i = 0; i < size; i++) { m.push(new Array(size).fill(false)); fn.push(new Array(size).fill(false)); }
    const set = (x, y, v) => { m[y][x] = v; fn[y][x] = true; };

    // finder patterns + separators
    [[0, 0], [size - 7, 0], [0, size - 7]].forEach(([fx, fy]) => {
      for (let dy = -1; dy <= 7; dy++) for (let dx = -1; dx <= 7; dx++) {
        const x = fx + dx, y = fy + dy;
        if (x < 0 || y < 0 || x >= size || y >= size) continue;
        const d = Math.max(Math.abs(dx - 3), Math.abs(dy - 3));
        set(x, y, d !== 2 && d !== 4);
      }
    });
    // timing
    for (let i = 8; i < size - 8; i++) { set(i, 6, i % 2 === 0); set(6, i, i % 2 === 0); }
    // alignment
    const al = ALIGN[ver];
    for (let i = 0; i < al.length; i++) for (let j = 0; j < al.length; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === al.length - 1) || (i === al.length - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
        set(al[i] + dx, al[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    // reserve format
    for (let i = 0; i < 9; i++) { if (!fn[8][i]) set(i, 8, false); if (!fn[i][8]) set(8, i, false); }
    for (let i = 0; i < 8; i++) { set(size - 1 - i, 8, false); set(8, size - 1 - i, false); }
    set(8, size - 8, true);
    // version info
    if (ver >= 7) {
      let rem = ver;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      const vb = (ver << 12) | rem;
      for (let i = 0; i < 18; i++) {
        const bit = (vb >>> i) & 1;
        const a = size - 11 + (i % 3), b = Math.floor(i / 3);
        set(a, b, !!bit); set(b, a, !!bit);
      }
    }
    // data placement
    let idx = 0;
    const totalBits = cw.length * 8;
    const getBit = i => (cw[i >> 3] >>> (7 - (i & 7))) & 1;
    let flip = true;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) {
        for (let j = 0; j < 2; j++) {
          const y = flip ? size - 1 - vert : vert;
          const x = right - j;
          if (!fn[y][x]) {
            m[y][x] = idx < totalBits ? !!getBit(idx) : false;
            idx++;
          }
        }
      }
      flip = !flip;
    }
    return { m, fn, size };
  }

  const MASKS = [
    (y, x) => (y + x) % 2 === 0,
    (y, x) => y % 2 === 0,
    (y, x) => x % 3 === 0,
    (y, x) => (y + x) % 3 === 0,
    (y, x) => (Math.floor(y / 2) + Math.floor(x / 3)) % 2 === 0,
    (y, x) => (y * x) % 2 + (y * x) % 3 === 0,
    (y, x) => ((y * x) % 2 + (y * x) % 3) % 2 === 0,
    (y, x) => ((y + x) % 2 + (y * x) % 3) % 2 === 0
  ];

  function applyMask(base, maskId) {
    const { m, fn, size } = base;
    const out = m.map((row, y) => row.map((v, x) => fn[y][x] ? v : (MASKS[maskId](y, x) ? !v : v)));
    // format info (ECC L = 01)
    const data = (1 << 3) | maskId;
    let rem = data;
    for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    const bits = ((data << 10) | rem) ^ 0x5412;
    const gb = i => (bits >>> i) & 1;
    for (let i = 0; i <= 5; i++) out[i][8] = !!gb(i);
    out[7][8] = !!gb(6); out[8][8] = !!gb(7); out[8][7] = !!gb(8);
    for (let i = 9; i < 15; i++) out[8][14 - i] = !!gb(i);
    for (let i = 0; i < 8; i++) out[8][size - 1 - i] = !!gb(i);
    for (let i = 8; i < 15; i++) out[size - 15 + i][8] = !!gb(i);
    out[size - 8][8] = true;
    return out;
  }

  function penalty(g) {
    const size = g.length;
    let p = 0;
    const run = arr => {
      let s = 0, last = arr[0], n = 1;
      for (let i = 1; i < arr.length; i++) {
        if (arr[i] === last) n++; else { if (n >= 5) s += 3 + (n - 5); last = arr[i]; n = 1; }
      }
      if (n >= 5) s += 3 + (n - 5);
      return s;
    };
    for (let y = 0; y < size; y++) p += run(g[y]);
    for (let x = 0; x < size; x++) p += run(g.map(r => r[x]));
    for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
      const v = g[y][x];
      if (v === g[y][x + 1] && v === g[y + 1][x] && v === g[y + 1][x + 1]) p += 3;
    }
    const pat = [true, false, true, true, true, false, true];
    const chk = arr => {
      let s = 0;
      for (let i = 0; i + 7 <= arr.length; i++) {
        let ok = true;
        for (let j = 0; j < 7; j++) if (arr[i + j] !== pat[j]) { ok = false; break; }
        if (ok) {
          let pre = true, post = true;
          for (let j = 1; j <= 4; j++) { if (i - j >= 0 && arr[i - j]) pre = false; if (i + 6 + j < arr.length && arr[i + 6 + j]) post = false; }
          if (pre || post) s += 40;
        }
      }
      return s;
    };
    for (let y = 0; y < size; y++) p += chk(g[y]);
    for (let x = 0; x < size; x++) p += chk(g.map(r => r[x]));
    let dark = 0;
    g.forEach(r => r.forEach(v => { if (v) dark++; }));
    const ratio = dark / (size * size);
    p += Math.floor(Math.abs(ratio * 100 - 50) / 5) * 10;
    return p;
  }

  function make(text) {
    const { ver, cw } = build(text);
    const base = matrix(ver, cw);
    let best = null, bestP = Infinity;
    for (let k = 0; k < 8; k++) {
      const g = applyMask(base, k);
      const p = penalty(g);
      if (p < bestP) { bestP = p; best = g; }
    }
    return best;
  }

  function svg(text, px, quiet) {
    const g = make(text), n = g.length;
    const q = quiet == null ? 4 : quiet, dim = n + q * 2;
    let path = '';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
      if (g[y][x]) path += 'M' + (x + q) + ' ' + (y + q) + 'h1v1h-1z';
    const w = px || 200;
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + w + '" viewBox="0 0 ' + dim + ' ' + dim +
      '" shape-rendering="crispEdges" role="img" aria-label="UPI QR code">' +
      '<rect width="' + dim + '" height="' + dim + '" fill="#fff"/><path d="' + path + '" fill="#000"/></svg>';
  }

  return { make, svg };
})();

function hashPw(s) {

  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;

      if (this.db) return res(this.db);

      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('files')) r.result.createObjectStore('files'); };

    });

      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  },
  async get(key) {
    const db = await this.open();

      const tx = db.transaction('files', 'readonly');

      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);

  },
  async del(key) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('files', 'readwrite');

/* ------------------------------- PROGRESS ------------------------------ */
function prog(uidv) {
  if (!DB.progress[uidv]) DB.progress[uidv] = { lec: {}, note: {}, dpp: {}, days: [] };
  const p = DB.progress[uidv];
  if (!p.days) p.days = [];
  return p;
}
function touchDay() {
  if (!ME) return;
  const p = prog(ME.id), k = todayKey();
  if (!p.days.includes(k)) { p.days.push(k); saveDB(); }
}
function streakDays() {
  if (!ME) return 0;
  const p = prog(ME.id), set = new Set(p.days);
  let n = 0, d = new Date();
  for (;;) {
    const k = d.toISOString().slice(0, 10);
    if (set.has(k)) { n++; d.setDate(d.getDate() - 1); }
    else if (n === 0 && k === todayKey()) { d.setDate(d.getDate() - 1); }
    else break;
  }
  return n;
}
function myEnroll() { return ME ? DB.enroll.filter(e => e.uid === ME.id) : []; }
function ownsBatch(bid) { return myEnroll().some(e => e.bid === bid); }
function hasAccess(item) { return (ME && ME.role === 'admin') || !!item.free || ownsBatch(item.batch); }
function myClass() { return ME && ME.cls ? ME.cls : 10; }

function statsFor(cls) {
  const lecs = DB.lectures.filter(l => l.cls === cls);
  const nts = DB.notes.filter(n => n.cls === cls);
  const dps = DB.dpps.filter(d => d.cls === cls);
  const p = prog(ME.id);
  const lecDone = lecs.filter(l => p.lec[l.id]).length;
  const noteDone = nts.filter(n => p.note[n.id]).length;
  const dppDone = dps.filter(d => p.dpp[d.id]).length;
  const res = DB.results.filter(r => r.uid === ME.id);
  const avg = res.length ? Math.round(res.reduce((a, r) => a + (r.score / r.total) * 100, 0) / res.length) : 0;
  const totalPct = lecs.length ? Math.round(((lecDone + noteDone) / (lecs.length + nts.length)) * 100) : 0;
  return { lecs, nts, dps, lecDone, noteDone, dppDone, res, avg, totalPct };
}

/* -------------------------------- ROUTER ------------------------------- */
function route() {
  if (!ME) return;
  if (typeof RUN !== 'undefined' && RUN && RUN.tick) { clearInterval(RUN.tick); RUN.tick = null; }
  const parts = (location.hash.replace(/^#\/?/, '') || 'home').split('/');
  const name = parts[0] || 'home';
  const a = parts[1] || '', b = parts[2] || '';
  if (name === 'admin') { if (ME.role !== 'admin') { adminGate(); return; } location.hash = '#/home'; return; }
  $('#app').classList.add('on');
  $('#auth-root').innerHTML = '';
  const v = $('#view');
  if (ME.role === 'admin') {
    if (['home', 'content', 'batches', 'students', 'payments', 'ann'].includes(name)) {
      renderShell();
      v.innerHTML = adminView(name, a, b);
      window.scrollTo({ top: 0 });
      return;
    }
    if (name === 'profile') { renderShell(); v.innerHTML = profileView(); window.scrollTo({ top: 0 }); return; }
    // admin can preview student views
  }
  renderShell();
  const map = {
    home: () => homeView(),
    class: () => classView(+a),
    lectures: () => lecturesView(a, b),
    watch: () => watchView(a),
    notes: () => notesView(a, b),
    note: () => noteView(a),
    dpp: () => dppView(),
    quiz: () => quizView(a),
    tests: () => testsView(),
    test: () => testIntro(a),
    runtest: () => testRun(a),
    result: () => resultView(a),
    batches: () => batchesView(),
    batch: () => batchView(a),
    profile: () => profileView(),
    search: () => searchView()
  };
  const fn = map[name] || map.home;
  v.innerHTML = fn();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  afterRender(name, a);
}
window.addEventListener('hashchange', route);

async function openPdf(id) {
  const n = DB.notes.find(x => x.id === id);
  if (!n || !n.pdf) return;
  try {
    const blob = await IDB.get(n.pdf.key);
    if (!blob) { toast('फ़ाइल नहीं मिली', 'err'); return; }
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { toast('PDF खोलने में समस्या', 'err'); }
}
async function downloadPdf(id) {
  const n = DB.notes.find(x => x.id === id);
  if (!n || !n.pdf) return;
  try {
    const blob = await IDB.get(n.pdf.key);
    if (!blob) { toast('फ़ाइल नहीं मिली', 'err'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = n.pdf.name || 'notes.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('डाउनलोड शुरू हुआ', 'ok');
  } catch (e) { toast('डाउनलोड विफल', 'err'); }
}

        '<div class="txt-s" style="color:var(--green-600);font-weight:600">सही उत्तर: ' + esc(q.o[q.a]) + '</div>' +
        (QZ.ans[i] !== q.a && QZ.ans[i] != null ? '<div class="txt-s txt-dim">आपका उत्तर: ' + esc(q.o[QZ.ans[i]]) + '</div>' : '') +
        '<div class="expl"><b>व्याख्या</b>' + esc(q.e) + '</div></div>').join('');
    return;
  }
  const q = d.qs[QZ.idx];
  const picked = QZ.picked;
  box.innerHTML = '<div class="row between mb10"><a class="btn btn-g btn-sm" href="#/dpp">' + ic('back') + ' बाहर</a>' +

    '</div>';

function qzPick(i) {
  if (QZ.picked != null) return;
  QZ.picked = i; QZ.ans[QZ.idx] = i;
  paintQuiz();
}
function qzNext() {
  const d = DB.dpps.find(x => x.id === QZ.id);
  if (QZ.idx < d.qs.length - 1) { QZ.idx++; QZ.picked = null; paintQuiz(); }
  else {
    const correct = QZ.ans.filter((v, i) => v === d.qs[i].a).length;
    const p = prog(ME.id);
    const rec = p.dpp[d.id] || { best: 0, tries: 0 };
    rec.best = Math.max(rec.best, correct); rec.tries++; rec.at = Date.now();
    p.dpp[d.id] = rec; saveDB(); touchDay();
    QZ.done = true; paintQuiz();
    window.scrollTo({ top: 0 });
  }
}

function testRun(id) {
  const t = DB.tests.find(x => x.id === id);

  if (!hasAccess(t)) return paywall('यह टेस्ट पेड बैच का है', '');
  if (!RUN || RUN.tid !== id) {
    RUN = { tid: id, idx: 0, ans: new Array(t.qs.length).fill(null), left: t.mins * 60, tick: null };
  }
  if (!RUN.tick) {
    RUN.tick = setInterval(() => {
      if (!RUN) return;
      RUN.left--;
      const el = $('#tleft');
      if (el) el.textContent = mmss(RUN.left);
      const tw = $('#timerwrap');
      if (tw) tw.classList.toggle('warn', RUN.left <= 60);

    }, 1000);

}
function mmss(s) {

}
function paintRun() {

function formModal(title, fields, vals, onSave) {
  vals = vals || {};
  const html = '<div class="sheet-grip"></div><h3 style="font-size:17px">' + esc(title) + '</h3>' +
    '<form id="mf" class="mt14">' + fields.map(f => {
      if (f.type === 'select') {
        return '<label class="field"><span>' + esc(f.label) + '</span><select class="inp" name="' + f.k + '">' +
          f.opts.map(o => '<option value="' + esc(o.v) + '"' + (String(vals[f.k]) === String(o.v) ? ' selected' : '') + '>' + esc(o.t) + '</option>').join('') +
          '</select></label>';
      }
      if (f.type === 'textarea') {
        return '<label class="field"><span>' + esc(f.label) + '</span><textarea class="inp" name="' + f.k + '" rows="' + (f.rows || 3) + '" placeholder="' + esc(f.ph || '') + '">' + esc(vals[f.k] || '') + '</textarea>' +
          (f.hint ? '<div class="txt-xs txt-dim mt6" style="line-height:1.6">' + f.hint + '</div>' : '') + '</label>';
      }
      if (f.type === 'file') {
        return '<label class="field"><span>' + esc(f.label) + '</span><input class="inp" type="file" name="' + f.k + '" accept="application/pdf">' +
          '<div class="txt-xs txt-dim mt6">PDF चुनें (अधिकतम 20 MB)। पुरानी फ़ाइल रहने के लिए खाली छोड़ें।</div></label>';
      }
      return '<label class="field"><span>' + esc(f.label) + '</span><input class="inp" name="' + f.k + '" type="' + (f.type || 'text') + '"' +
        (f.step ? ' step="' + f.step + '"' : '') + ' value="' + esc(vals[f.k] ?? '') + '" placeholder="' + esc(f.ph || '') + '"></label>';
    }).join('') +
    '<div class="row form-actions" style="gap:10px"><button type="button" class="btn btn-g grow" data-close>रद्द करें</button>' +
    '<button class="btn btn-p grow" type="submit">सहेजें</button></div></form>';
  openModal(html);
  ADM_FILE = null;
  $('#mf').onsubmit = e => {
    e.preventDefault();
    const data = new FormData(e.target), obj = {};
    fields.forEach(f => { if (f.type !== 'file') obj[f.k] = (data.get(f.k) ?? '').toString().trim(); });
    const fi = e.target.querySelector('input[type=file]');
    const file = fi && fi.files && fi.files[0] ? fi.files[0] : null;
    onSave(obj, file);
  };
}
function subjOpts() {
  const out = [];
  [9, 10, 11, 12].forEach(c => SUBJECTS[c].forEach(s => out.push({ v: c + ':' + s.id, t: 'कक्षा ' + c + ' · ' + s.n })));
  return out;
}
function batchOpts() { return DB.batches.map(b => ({ v: b.id, t: 'क' + b.cls + ' · ' + b.title })); }
function clsOpts() { return [9, 10, 11, 12].map(c => ({ v: c, t: 'कक्षा ' + c })); }
function yesNo() { return [{ v: '1', t: 'हाँ — सभी के लिए फ्री' }, { v: '0', t: 'नहीं — केवल बैच खरीदने पर' }]; }

function parseQs(text) {
  return String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split('|').map(s => s.trim());
    if (p.length < 6) return null;
    const ai = Math.max(0, Math.min(3, (parseInt(p[5], 10) || 1) - 1));
    return { q: p[0], o: p.slice(1, 5), a: ai, e: p[6] || '' };
  }).filter(Boolean);
}
function qsToText(qs) {
  return qs.map(q => [q.q].concat(q.o).concat([String(q.a + 1)]).concat([q.e || '']).join(' | ')).join('\n');
}

function editNote(id) {
  const n = DB.notes.find(x => x.id === id) || {};
  formModal(id ? 'नोट संपादित करें' : 'नया नोट जोड़ें', [
    { k: 'sub', label: 'विषय (कक्षा सहित)', type: 'select', opts: subjOpts() },

    { k: 'batch', label: 'बैच', type: 'select', opts: batchOpts() },
    { k: 'free', label: 'फ्री रखें?', type: 'select', opts: yesNo() },
    { k: 'summary', label: 'सारांश (प्रति पंक्ति एक अनुच्छेद)', type: 'textarea', rows: 4 },
    { k: 'points', label: 'महत्वपूर्ण बिंदु (प्रति पंक्ति एक)', type: 'textarea', rows: 4 },
    { k: 'pdf', label: 'PDF फ़ाइल', type: 'file' }
  ], {
    sub: n.sub ? n.cls + ':' + n.sub : '', title: n.title || '', chapter: n.chapter || '',
    batch: n.batch || (batchOpts()[0] || {}).v, free: n.free ? '1' : '0',
    summary: (n.summary || []).join('\n'), points: (n.points || []).join('\n')
  }, async (v, file) => {
    const [cls, sub] = v.sub.split(':');
    const rec = {
      id: n.id || uid('N'), cls: +cls, sub, title: v.title || v.chapter, chapter: v.chapter || v.title,
      batch: v.batch, free: v.free === '1', curated: true,
      summary: v.summary ? v.summary.split('\n').filter(Boolean) : ['इस अध्याय के नोट्स।'],
      points: v.points ? v.points.split('\n').filter(Boolean) : [],
      pdf: n.pdf || null
    };
    if (file) {
      if (file.size > 20 * 1024 * 1024) { toast('PDF 20 MB से छोटी होनी चाहिए', 'err'); return; }
      const key = 'pdf_' + rec.id;
      try { await IDB.put(key, file); rec.pdf = { key, name: file.name, size: file.size }; }
      catch (e) { toast('फ़ाइल सहेजी नहीं जा सकी', 'err'); return; }
    }
    if (n.id) Object.assign(DB.notes.find(x => x.id === n.id), rec); else DB.notes.push(rec);

  formModal(id ? 'DPP संपादित करें' : 'नई DPP बनाएँ', [

    { k: 'title', label: 'DPP शीर्षक' },
    { k: 'chapter', label: 'अध्याय' },
    { k: 'mins', label: 'समय (मिनट)', type: 'number' },

  ], {

  }, (v) => {

    };

function editTest(id) {

  formModal(id ? 'टेस्ट संपादित करें' : 'नया टेस्ट बनाएँ', [

    { k: 'title', label: 'टेस्ट शीर्षक' },
    { k: 'type', label: 'प्रकार', type: 'select', opts: [{ v: 'मॉक टेस्ट', t: 'मॉक टेस्ट' }, { v: 'क्विज़', t: 'क्विज़' }, { v: 'DPP टेस्ट', t: 'DPP टेस्ट' }] },
    { k: 'batch', label: 'बैच', type: 'select', opts: batchOpts() },

  }, (v) => {

      id: t.id || uid('T'), cls: +v.cls, sub: t.sub || 'all', title: v.title, type: v.type,
      batch: v.batch, free: v.free === '1', mins: +v.mins || 30, qs
    };
    if (t.id) Object.assign(DB.tests.find(x => x.id === t.id), rec); else DB.tests.push(rec);
    saveDB(); closeModal(); toast('टेस्ट सहेजा गया', 'ok'); route();

  ], {

  formModal(id ? 'घोषणा संपादित करें' : 'नई घोषणा', [
    { k: 'title', label: 'शीर्षक' },

  ], { title: a.title || '', body: a.body || '' }, (v) => {
    if (!v.title) { toast('शीर्षक लिखें', 'err'); return; }
    if (a.id) Object.assign(DB.ann.find(x => x.id === a.id), { title: v.title, body: v.body });
    else DB.ann.push({ id: uid('A'), title: v.title, body: v.body, at: Date.now() });
    saveDB(); closeModal(); toast('घोषणा भेज दी गई', 'ok'); route();
  });
}
function delItem(kind, id) {
  const names = { lectures: 'व्याख्यान', notes: 'नोट', dpps: 'DPP', tests: 'टेस्ट', batches: 'बैच', users: 'विद्यार्थी', ann: 'घोषणा' };
  openModal('<div class="sheet-grip"></div><h3 style="font-size:17px">' + (names[kind] || 'आइटम') + ' हटाएँ?</h3>' +
    '<p class="txt-s txt-dim mt6">यह क्रिया पूर्ववत नहीं की जा सकती। संबंधित प्रगति भी हट जाएगी।</p>' +
    '<div class="row mt18" style="gap:10px"><button class="btn btn-g grow" data-close>रद्द करें</button>' +
    '<button class="btn btn-d grow" onclick="doDel(\'' + kind + '\',\'' + id + '\')">हाँ, हटाएँ</button></div>');
}
function doDel(kind, id) {
  if (kind === 'users') {
    DB.users = DB.users.filter(u => u.id !== id);
    DB.enroll = DB.enroll.filter(e => e.uid !== id);
    DB.results = DB.results.filter(r => r.uid !== id);
    delete DB.progress[id];
  } else if (kind === 'batches') {
    DB.batches = DB.batches.filter(b => b.id !== id);
    DB.enroll = DB.enroll.filter(e => e.bid !== id);
  } else {
    DB[kind] = DB[kind].filter(x => x.id !== id);
  }
  saveDB(); closeModal(); toast('हटा दिया गया', 'ok'); route();
}

function previewQr() {
  const st = DB.settings || {};
  if (!st.upi) { toast('पहले UPI ID सेव करें', 'err'); return; }
  const b = { cls: myClass(), tag: 'PREVIEW', price: CFG.batchPrice };
  openModal('<div class="sheet-grip"></div><h3 style="font-size:16px">भुगतान QR — प्रीव्यू</h3>' +
    '<p class="txt-xs txt-dim mt6">छात्रों को यही QR दिखेगा (₹' + CFG.batchPrice + ' पहले से भरा हुआ)।</p>' +
    '<div class="qrbox mt14">' + qrBlock(b) + '<b>' + esc(st.upi) + '</b>' +
    '<p class="txt-xs txt-dim">' + esc(st.payee || CFG.brand) + '</p></div>' +
    '<p class="txt-xs txt-dim mt10" style="line-height:1.6">अपने फ़ोन के कैमरे या UPI ऐप से इसे स्कैन करके ₹1 का टेस्ट भुगतान करें।</p>' +
    '<button class="btn btn-g btn-block mt14" data-close>बंद करें</button>');
}
function uploadQr(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  if (!/^image\//.test(f.type)) { toast('केवल इमेज फ़ाइल चुनें', 'err'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 420, sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      try { DB.settings.qrImg = cv.toDataURL('image/jpeg', 0.88); }
      catch (e) { DB.settings.qrImg = rd.result; }
      saveDB(); toast('QR इमेज जुड़ गई', 'ok'); route();
    };
    img.onerror = () => { toast('इमेज नहीं पढ़ी जा सकी', 'err'); };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
}
function removeQr() { DB.settings.qrImg = null; saveDB(); toast('QR हटा दिया', 'ok'); route(); }
function saveUpi() {
  const upi = ($('#st-upi').value || '').trim();
  const payee = ($('#st-payee').value || '').trim() || CFG.brand;
  if (upi && !/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(upi)) { toast('UPI ID सही नहीं लग रही (jaise naam@okaxis)', 'err'); return; }
  DB.settings.upi = upi; DB.settings.payee = payee;
  saveDB(); toast('भुगतान सेटिंग्स सेव हो गईं', 'ok'); route();
}
function approvePay(id) {
  const r = DB.payreq.find(x => x.id === id);
  if (!r) return;
  r.status = 'approved'; r.actedAt = Date.now();
  if (!DB.enroll.some(e => e.uid === r.uid && e.bid === r.bid)) {
    DB.enroll.push({ id: uid('E'), uid: r.uid, bid: r.bid, amount: r.amount, mode: 'upi', txn: r.ref, at: Date.now() });
  }
  saveDB(); toast('भुगतान स्वीकार — बैच खुल गया', 'ok'); route();
}
function rejectPay(id) {
  const r = DB.payreq.find(x => x.id === id);
  if (!r) return;
  r.status = 'rejected'; r.actedAt = Date.now();
  saveDB(); toast('अस्वीकार कर दिया', 'ok'); route();
}

/* ---------------------------------- BOOT -------------------------------- */
(function boot() {
  loadDB();
  const s = session();
  if (s && DB.users.some(u => u.id === s.uid)) {
    ME = DB.users.find(u => u.id === s.uid);
    $('#auth-root').innerHTML = '';
    $('#app').classList.add('on');
    if (ME.role === 'admin' && (!location.hash || location.hash === '#/')) location.hash = '#/admin/home';
    else if (!location.hash || location.hash === '#/') location.hash = '#/home';
    renderShell();
    route();
  } else {
    showAuth('login');
  }
  setTimeout(() => {
    const sp = $('#splash');
    if (sp) { sp.classList.add('gone'); setTimeout(() => sp.remove(), 700); }
  }, 1150);
})();
</script>
